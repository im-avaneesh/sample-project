<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Pipeline Demo</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0078D7, #00B4DB);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            text-align:center;
            background: rgba(255,255,255,0.1);
            padding:40px;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
        }

        h1{
            font-size:40px;
            margin-bottom:10px;
        }

        p{
            font-size:20px;
        }

        .btn{
            margin-top:20px;
            display:inline-block;
            padding:12px 25px;
            background:white;
            color:#0078D7;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:#f0f0f0;
            transform:scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DevOps Pipeline Deployment</h1>
        <p>Successfully deployed using Azure DevOps CI/CD Pipeline</p>

        <a href="#" class="btn">Deployment Successful ✅</a>
    </div>

</body>
</html>
